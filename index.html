<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>html,body{margin:0;height:100%;background:#120a2a;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right)}

#rotate b{font-size:64px;animation:r 1.6s infinite}@keyframes r{50%{transform:rotate(90deg)}}

</head><body><div id="game"></div><div id="rotate"><b>📱</b>Rotate to landscape<br>to play HERO DASH</div>
